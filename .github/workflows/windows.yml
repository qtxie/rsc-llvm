name: Windows

on:
  push:
    branches: [ master ]

jobs:
  Build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v2

    - name: Build
      run: xmake -v
      shell: cmd

    - uses: actions/upload-artifact@v2
      with:
        name: redsc-win-x64
        path: build/windows/x64/release/redsc.exe
